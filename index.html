<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Nightmare - Flappy Run</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-board">
        <!-- Live Score Display -->
        <div id="score">Score: 0</div>
        <div id="high-score">Best: 0</div>

        <!-- Ghost Character -->
        <div id="ghost"></div>

        <!-- 1. Welcome Screen -->
        <div id="welcome-screen" class="overlay">
            <h1>👻 GHOST RUN</h1>
            <p>Spooky Flappy Adventure</p>
            <button class="btn" onclick="enterGame()">ENTER GAME</button>
        </div>

        <!-- 2. Menu / Difficulty Select Screen -->
        <div id="menu-screen" class="overlay" style="display: none;">
            <h2>SELECT MODE</h2>
            <div class="diff-container">
                <button class="diff-btn active" data-speed="1.8" onclick="selectDiff(this)">CHILL (130px)</button>
                <button class="diff-btn" data-speed="2.8" onclick="selectDiff(this)">SPOOKY (115px)</button>
                <button class="diff-btn" data-speed="3.8" onclick="selectDiff(this)">PRO (100px)</button>
            </div>
            <button class="btn start-btn" onclick="startGame()">START GAME</button>
        </div>

        <!-- 3. Game Over Screen -->
        <div id="game-over-screen" class="overlay" style="display: none;">
            <h1 class="game-over-text">GAME OVER</h1>
            <p id="final-score">Current Score: 0</p>
            <p id="best-score-display">High Score: 0</p>
            <div class="btn-group">
                <button class="btn" onclick="startGame()">RETRY</button>
                <button class="btn menu-btn-style" onclick="showMenu()">MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
