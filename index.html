<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Run - Flappy Nightmare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-board">
        <div id="score">Score: 0</div>
        <div id="high-score">Best: 0</div>

        <div id="ghost" class="skin-ghost"></div>

        <!-- Start Screen -->
        <div id="welcome-screen" class="overlay">
            <h1>👻 GHOST RUN</h1>
            <p>Spooky Flappy Adventure</p>
            <button class="btn" onclick="enterGame()">ENTER GAME</button>
        </div>

        <!-- Menu Screen -->
        <div id="menu-screen" class="overlay" style="display: none;">
            <h3>CHOOSE CHARACTER</h3>
            <div class="skin-container">
                <button class="skin-btn active" onclick="selectSkin('ghost', this)">👻 Ghost</button>
                <button class="skin-btn" onclick="selectSkin('star', this)">⭐ Star</button>
                <button class="skin-btn" onclick="selectSkin('snake', this)">🐍 Snake</button>
            </div>

            <h3>SELECT MODE</h3>
            <div class="diff-container">
                <button class="diff-btn active" data-speed="2.2" data-gap="180" onclick="selectDiff(this)">EASY</button>
                <button class="diff-btn" data-speed="2.8" data-gap="160" onclick="selectDiff(this)">MEDIUM</button>
                <button class="diff-btn" data-speed="3.4" data-gap="140" onclick="selectDiff(this)">HARD</button>
                <button class="diff-btn" data-speed="4.0" data-gap="120" onclick="selectDiff(this)">PRO</button>
            </div>

            <button class="btn" onclick="startGame()">START GAME</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay" style="display: none;">
            <h1>GAME OVER</h1>
            <p id="final-score">Current Score: 0</p>
            <p id="best-score-display">High Score: 0</p>
            <div class="btn-group">
                <button class="btn" onclick="startGame()">RETRY</button>
                <button class="btn menu-btn-style" onclick="showMenu()">MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
